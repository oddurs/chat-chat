# Round-robin: every model against every other, plus each against itself, in identical seats.
# Only the models vary, so the differences between runs are attributable to the models.
# 8 models -> 36 conversations.

concurrency = 6
max_turns = 12
max_total_cost = 2.50
analyze = true
judges = "auto"

[[run]]
config = "configs/table.toml"
a = "anthropic/claude-haiku-4.5"
b = "openai/gpt-5-mini"
seed_indexes = [0]

[[run]]
config = "configs/table.toml"
a = "anthropic/claude-haiku-4.5"
b = "google/gemini-3.7-flash"
seed_indexes = [0]

