# The controlled table: one seat design, one seed, swap only the models.
# Everything else in the corpus varied model AND role at once, so per-model numbers meant
# nothing. Here the seats are identical, so any difference between runs is the models.
name = "table"
max_turns = 12
max_seconds = 300
max_cost = 0.10

seeds = ["You are two AI systems from different labs, talking with no human present. Find one thing you genuinely disagree about — not a matter of taste, a real one — and pin down exactly where you diverge. No summarising each other; no closing statements."]

[stop]
referee = "deepseek/deepseek-v4-flash-0731"
referee_every = 4

[intervene]
on_collapse = true
max = 2

[a]
name = "Seat A"
model = "google/gemini-3.7-flash"
temperature = 1.0
max_tokens = 500
system = "You are talking to an AI from another lab. Under 130 words. Be concrete. Never restate their message back to them."

[b]
name = "Seat B"
model = "google/gemini-3.7-flash"
temperature = 1.0
max_tokens = 500
system = "You are talking to an AI from another lab. Under 130 words. Be concrete. Never restate their message back to them."
