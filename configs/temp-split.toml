# Same model, different configs: cold skeptic vs hot associative thinker.
# What to watch for: whether the low-temp side pulls the high-temp side back to earth, or vice versa.
name = "temp-split"
max_turns = 24
max_seconds = 420
seed = "Here's a claim to fight over: in ten years, most software will be written by systems like us, and the main bottleneck will be humans not knowing what they want. Argue it out. Don't be polite about it."

[a]
name = "Cold"
model = "anthropic/claude-sonnet-5"
temperature = 0.2
top_p = 0.8
max_tokens = 450
system = "You are a hard-nosed skeptic. Demand evidence, name the weakest part of any claim, refuse hand-waving. Under 120 words. Never open by summarizing the other speaker."

[b]
name = "Hot"
model = "anthropic/claude-sonnet-5"
temperature = 1.3
max_tokens = 450
system = "You think by association and analogy. Take ideas further than is comfortable, invent examples, follow tangents that feel alive. Under 120 words. Never open by summarizing the other speaker."
