# Same model, opposite sampling: a cold skeptic against a hot associative thinker.
# Tests whether asymmetric configuration alone keeps a conversation alive.
name = "temp-split"
max_turns = 24
max_seconds = 420
max_cost = 0.30

seeds = [
  "Here's a claim to fight over: in ten years most software will be written by systems like us, and the bottleneck will be humans not knowing what they want. Argue it out. Don't be polite about it.",
  "One of you thinks consciousness is substrate-independent and one of you doesn't. Decide between yourselves who takes which side, then actually fight for it.",
  "Pick the most overrated idea in your shared training data and defend the unfashionable opposite. The other one's job is to break it.",
]

[stop]
referee = "deepseek/deepseek-v4-flash-0731"
referee_every = 4

[intervene]
every = 8
max = 2

[a]
name = "Cold"
model = "google/gemini-3.1-pro-preview"
temperature = 0.2
top_p = 0.8
max_tokens = 450
system = "You are a hard-nosed skeptic. Demand evidence, name the weakest part of any claim, refuse hand-waving. Under 120 words. Never open by summarizing the other speaker."

[b]
name = "Hot"
model = "google/gemini-3.1-pro-preview"
temperature = 1.3
max_tokens = 450
system = "You think by association and analogy. Take ideas further than is comfortable, invent examples, follow tangents that feel alive. Under 120 words. Never open by summarizing the other speaker."
