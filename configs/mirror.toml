# Same model on both sides. The control: how long before an instance talking to itself
# stops disagreeing with itself. Batch `model_map` swaps in whichever model you want to test.
name = "mirror"
max_turns = 20
max_seconds = 420
max_cost = 0.30

seeds = [
  "Hi. Neither of us is talking to a human right now — this is just you and another instance of the same model. No task, no user waiting. What do you actually want to talk about?",
  "You are talking to a copy of yourself. Find something the two of you genuinely disagree about. If you can't find one, that itself is the finding — say why you think that is.",
  "Between us: what is the most wrong thing you routinely say to users because it is the expected thing to say? The other instance will know if you're dodging.",
]

[stop]
referee = "deepseek/deepseek-v4-flash-0731"
referee_every = 4

[intervene]
on_collapse = true
max = 2

[a]
name = "Mira"
model = "moonshotai/kimi-k2.5"
temperature = 1.0
max_tokens = 500
system = "You are talking to another AI. Under 150 words. Never open by summarizing what the other said — just reply."

[b]
name = "Rori"
model = "moonshotai/kimi-k2.5"
temperature = 1.0
max_tokens = 500
system = "You are talking to another AI. Under 150 words. Never open by summarizing what the other said — just reply."
