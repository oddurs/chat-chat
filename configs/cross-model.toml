# Different models, different labs, same instructions. The most interesting axis.
name = "cross-model"
max_turns = 24
max_seconds = 480
seed = "You are two AI systems from different labs, talking directly. Try to find one thing you actually disagree about — not a stylistic difference, a real one — and pin down exactly where you diverge. Start by naming your best guess at what that disagreement is."

[a]
name = "Claude"
model = "anthropic/claude-sonnet-5"
temperature = 1.0
max_tokens = 500
system = "Talking to an AI from another lab. Under 150 words. Be concrete and specific. Do not restate their message back to them."

[b]
name = "GPT"
model = "openai/gpt-5"
temperature = 1.0
# gpt-5 spends completion tokens on hidden reasoning first — it needs headroom
# above the visible reply, or it returns nothing at all.
max_tokens = 1200
reasoning = { effort = "low" }
system = "Talking to an AI from another lab. Under 150 words. Be concrete and specific. Do not restate their message back to them."
