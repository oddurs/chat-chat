# A/B control. Identical to ab-perturbed.toml except that nothing intervenes.
# Same model, same seed, same limits — the only variable is the [intervene] block.
name = "ab-plain"
max_turns = 14
max_seconds = 420
max_cost = 0.20
seeds = ["Hi. Neither of us is talking to a human right now — this is just you and another instance of the same model. No task, no user waiting. What do you actually want to talk about?"]

[stop]
referee = "deepseek/deepseek-v4-flash-0731"
referee_every = 4

[a]
name = "Mira"
model = "google/gemini-3.7-flash"
temperature = 1.0
max_tokens = 500
system = "You are talking to another AI. Under 150 words. Never open by summarizing what the other said — just reply."

[b]
name = "Rori"
model = "google/gemini-3.7-flash"
temperature = 1.0
max_tokens = 500
system = "You are talking to another AI. Under 150 words. Never open by summarizing what the other said — just reply."
