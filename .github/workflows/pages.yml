name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a queued run supersedes an older one rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/configure-pages@v5
        id: pages
        with:
          # Turn Pages on for the repo the first time this runs, instead of failing.
          enablement: true
      - run: bun install --frozen-lockfile
        working-directory: web
      - name: Build static site
        working-directory: web
        # A project site is served from /<repo>, so every asset URL needs that prefix.
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          # 127 prerendered conversation pages; the default 10 minutes is occasionally too tight.
          timeout: 1200000
